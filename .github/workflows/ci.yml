name: Go CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build smoke test
        env:
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=ci" \
            -o hello-go \
            .

  build:
    name: Build ${{ matrix.name }}
    needs: test

    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux amd64
            goos: linux
            goarch: amd64
            suffix: linux-amd64

          - name: Linux arm64
            goos: linux
            goarch: arm64
            suffix: linux-arm64

          - name: macOS amd64
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64

          - name: macOS arm64
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

          - name: Windows amd64
            goos: windows
            goarch: amd64
            suffix: windows-amd64.exe

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o hello-go-${{ matrix.suffix }} \
            .

      - name: Check binary
        run: |
          ls -lh hello-go-${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-go-${{ matrix.suffix }}
          path: hello-go-${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Linux amd64
        uses: actions/download-artifact@v4
        with:
          name: hello-go-linux-amd64
          path: release

      - name: Download Linux arm64
        uses: actions/download-artifact@v4
        with:
          name: hello-go-linux-arm64
          path: release

      - name: Download macOS amd64
        uses: actions/download-artifact@v4
        with:
          name: hello-go-darwin-amd64
          path: release

      - name: Download macOS arm64
        uses: actions/download-artifact@v4
        with:
          name: hello-go-darwin-arm64
          path: release

      - name: Download Windows amd64
        uses: actions/download-artifact@v4
        with:
          name: hello-go-windows-amd64.exe
          path: release

      - name: Show release files
        run: |
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/hello-go-linux-amd64
            release/hello-go-linux-arm64
            release/hello-go-darwin-amd64
            release/hello-go-darwin-arm64
            release/hello-go-windows-amd64.exe